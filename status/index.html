<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>État des services — CBRS</title>
<meta name="description" content="Disponibilité du site et du CMS du CBRS sur 30 jours, charge du serveur."/>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"/>
<link rel="stylesheet" href="/status/status.css?v=1"/>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="/" aria-label="Retour au site du CBRS">
      <img src="/logo-cbrs.png" alt="" width="44" height="44"/>
      <span>CBRS · État des services</span>
    </a>
    <a class="back" href="/">Retour au site</a>
  </div>
</header>

<main class="wrap">
  <section class="overall" id="overall" aria-live="polite">
    <p class="overall-title" id="overall-title">Chargement…</p>
    <p class="overall-sub" id="overall-sub"></p>
  </section>

  <section aria-labelledby="h-dispo">
    <h2 id="h-dispo">Disponibilité sur 30 jours</h2>
    <div class="cards" id="services"></div>
  </section>

  <section aria-labelledby="h-charge">
    <div class="head-row">
      <h2 id="h-charge">Charge du serveur</h2>
      <div class="seg" role="group" aria-label="Période">
        <button type="button" data-range="24h" aria-pressed="true">24 heures</button>
        <button type="button" data-range="30d" aria-pressed="false">30 jours</button>
      </div>
    </div>
    <div class="cards" id="server"></div>
    <p class="note">Ressources vues par l’hébergement du site (processeur : charge sur 1 min rapportée au nombre de cœurs ; mémoire : part utilisée, hors cache).</p>
  </section>

  <section aria-labelledby="h-inc">
    <h2 id="h-inc">Incidents récents</h2>
    <div class="card" id="incidents"></div>
  </section>

  <p class="note foot" id="foot"></p>
</main>

<script src="/status/status.js?v=1"></script>
</body>
</html>
