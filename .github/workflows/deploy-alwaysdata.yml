name: Déploiement alwaysdata (test)

# Met à jour le site de test à chaque fusion sur main. La production Vercel n'est pas concernée.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cible:
        description: "Partie à déployer"
        type: choice
        options: [all, static, api, cms]
        default: all

concurrency:
  group: deploy-alwaysdata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clé SSH de déploiement
        env:
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ALWAYSDATA_SSH_KEY" > ~/.ssh/cbrs_deploy
          chmod 600 ~/.ssh/cbrs_deploy

      - name: Choix des parties à déployer
        id: cible
        env:
          DEMANDE: ${{ inputs.cible }}
          AVANT: ${{ github.event.before }}
        run: |
          if [ -n "$DEMANDE" ]; then
            echo "liste=$DEMANDE" >> "$GITHUB_OUTPUT"
          elif [ -n "$AVANT" ] && ! echo "$AVANT" | grep -qE '^0+$' \
               && git diff --quiet "$AVANT" "$GITHUB_SHA" -- cms; then
            # Le CMS n'a pas changé : inutile de le reconstruire.
            echo "liste=static api" >> "$GITHUB_OUTPUT"
          else
            echo "liste=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Déploiement
        env:
          SSH_OPTS: -i /home/runner/.ssh/cbrs_deploy -o IdentitiesOnly=yes
          AD_API_TOKEN: ${{ secrets.ALWAYSDATA_API_TOKEN }}
        run: |
          for cible in ${{ steps.cible.outputs.liste }}; do
            deploy/alwaysdata/deploy.sh "$cible"
          done
